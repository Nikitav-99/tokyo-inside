<script>
  (function () {
    // Порядок резервов: живой сайт с актуальными ценами, затем снимок
    // на этом же домене, затем внешняя копия.
    var SOURCES = [
      { url: 'https://notebook2.routerjp.netcraze.pro/', backup: false },
      { url: '/backup.html', backup: true },
      { url: 'https://sparkly-nasturtium-ec39c2.netlify.app/', backup: true }
    ];

    var frame = document.getElementById('site');
    var loader = document.getElementById('loader');
    var note = document.getElementById('fallback-note');

    var current = 0;
    var settled = false;
    var watchdog = null;
    var metrikaLoaded = false;

    function stopWatchdog() {
      if (watchdog) {
        clearTimeout(watchdog);
        watchdog = null;
      }
    }

    // Подключаем счётчик, когда сайт уже показан, чтобы его 292 КБ не отнимали
    // канал у загрузки iframe. Команды к этому моменту лежат в очереди ym.a.
    function loadMetrika() {
      if (metrikaLoaded) return;
      metrikaLoaded = true;
      var s = document.createElement('script');
      s.async = 1;
      s.src = 'https://mc.yandex.ru/metrika/tag.js';
      document.head.appendChild(s);
    }

    // Страховка: сайт мог не отрисоваться и сигнал не прийти — визит всё равно
    // должен попасть в статистику.
    setTimeout(loadMetrika, 10000);

    // Источник ответил: убираем экран загрузки и, если открыт снимок,
    // помечаем это для админа.
    function succeed() {
      if (settled) return;
      settled = true;
      stopWatchdog();
      loader.style.opacity = '0';
      setTimeout(function () { loader.style.display = 'none'; }, 400);
      if (SOURCES[current].backup) {
        note.classList.add('show');
      }
      loadMetrika();
    }

    // Переход к следующему источнику.
    function fail() {
      if (settled) return;
      stopWatchdog();

      // Резервы кончились: не ответил никто. Экран загрузки оставляем —
      // на нём как раз написано, что при зависшей загрузке стоит включить VPN,
      // а это самая вероятная причина, когда молчат сразу все адреса.
      if (current >= SOURCES.length - 1) return;

      current++;
      watchdog = setTimeout(fail, 8000);
      frame.src = SOURCES[current].url;
    }

    // Экран загрузки гасим по сигналу от самого сайта, а не по событию load.
    // Load означает лишь, что скачан HTML, — React в этот момент ещё не отрисовал
    // страницу. Раньше из-за этого внешний экран исчезал слишком рано, и посетитель
    // видел второй экран загрузки, уже внутренний: отсюда были вспышка и рывок
    // анимации на стыке.
    window.addEventListener('message', function (e) {
      if (!e.data || e.data.type !== 'tokyo-inside-ready') return;

      // Слушаем только тот адрес, который сами же и загрузили
      var expected;
      try {
        expected = new URL(SOURCES[current].url, location.href).origin;
      } catch (err) {
        return;
      }
      if (e.origin !== expected) return;

      succeed();
    });

    frame.addEventListener('load', function () {
      // HTML доехал — значит источник живой, и переключаться на резерв больше
      // не нужно. Медленный рендер резервом не лечится: там тот же React,
      // тот же Babel и то же устройство.
      stopWatchdog();
    });

    // Быстрая проверка доступности основного сервера. Ответ непрозрачный
    // (mode: no-cors), поэтому она ловит обрыв связи и таймаут, но не
    // отличает 502 от 200 — на этот случай работает watchdog ниже.
    if (window.fetch && window.AbortController) {
      var ac = new AbortController();
      var probeTimer = setTimeout(function () { ac.abort(); }, 4000);

      fetch(SOURCES[0].url, { mode: 'no-cors', cache: 'no-store', signal: ac.signal })
        .then(function () { clearTimeout(probeTimer); })
        .catch(function () {
          clearTimeout(probeTimer);
          if (!settled && current === 0) fail();
        });
    }

    watchdog = setTimeout(fail, 8000);
  })();
</script>
