<style>

  #loader {

    display: flex;

  /* Vignette & Grid */
  #loader::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 50%, transparent 0%, #050010 90%);
    z-index: 1;
    pointer-events: none;
  }

  #loader::after {
    content: '';
    position: absolute;
    inset: -50%;
    width: 200%;
    height: 200%;
    background-image:
      linear-gradient(rgba(189, 0, 255, 0.15) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 243, 255, 0.15) 1px, transparent 1px);
    background-size: 60px 60px;
    transform: perspective(500px) rotateX(60deg);
    animation: grid-move 5s linear infinite;
    z-index: -1;
    opacity: 0.6;
    mask-image: radial-gradient(circle at center, black 0%, transparent 70%);
    -webkit-mask-image: radial-gradient(circle at center, black 0%, transparent 70%);
  }

  @keyframes grid-move {
    0% { transform: perspective(500px) rotateX(60deg) translateY(0); }
    100% { transform: perspective(500px) rotateX(60deg) translateY(60px); }
  }

  /* CYBER STAR */
  .loader-content {

    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }

    width: 120px;
    height: 120px;
    margin-bottom: 30px;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .star-core {
    position: absolute;
    width: 100%;
    height: 100%;
    background: conic-gradient(from 0deg, #00f3ff, #bd00ff, #ff0099, #00f3ff);
    clip-path: polygon(50% 0%, 65% 35%, 100% 50%, 65% 65%, 50% 100%, 35% 65%, 0% 50%, 35% 35%);
    animation: star-spin 3s linear infinite;
    filter: drop-shadow(0 0 20px rgba(189, 0, 255, 0.6));
  }

  .star-core::after {
    content: '';
    position: absolute;
    inset: 6px;
    background: #050010;
    clip-path: polygon(50% 0%, 65% 35%, 100% 50%, 65% 65%, 50% 100%, 35% 65%, 0% 50%, 35% 35%);
  }

  .star-inner {
    position: absolute;
    width: 25%;
    height: 25%;
    background: #fff;
    transform: rotate(45deg);
    animation: pulse-star 0.5s ease-in-out infinite alternate;
    box-shadow: 0 0 20px #00f3ff;
  }

  /* Glitch Text */
  .loader-title {
    font-size: 42px;
    font-weight: 900;
    color: white;
    font-style: italic;
    letter-spacing: -2px;
    text-transform: uppercase;
    position: relative;
    text-shadow: 4px 4px 0px #bd00ff;
    margin: 0;
    line-height: 1;

  .loader-subtitle {

    color: #00f3ff;

    font-weight: 700;
    margin-bottom: 40px;

  @keyframes pulse-star {

  @keyframes blink {

<script>
  (function () {
    // Порядок резервов: живой сайт с актуальными ценами, затем снимок
    // на этом же домене, затем внешняя копия.
    var SOURCES = [
      { url: 'https://notebook2.routerjp.netcraze.pro/', backup: false },
      { url: '/backup.html', backup: true },
      { url: 'https://sparkly-nasturtium-ec39c2.netlify.app/', backup: true }
    ];

    var frame = document.getElementById('site');
    var loader = document.getElementById('loader');
    var note = document.getElementById('fallback-note');

    var current = 0;
    var settled = false;
    var watchdog = null;

    function stopWatchdog() {
      if (watchdog) {
        clearTimeout(watchdog);
        watchdog = null;
      }
    }

    // Источник ответил: убираем экран загрузки и, если открыт снимок,
    // помечаем это для админа.
    function succeed() {
      if (settled) return;
      settled = true;
      stopWatchdog();
      loader.style.opacity = '0';
      setTimeout(function () { loader.style.display = 'none'; }, 400);
      if (SOURCES[current].backup) {
        note.classList.add('show');
      }
    }

    // Переход к следующему источнику. Последний оставляем как есть:
    // даже неудачный он лучше пустого экрана.
    function fail() {
      if (settled) return;
      stopWatchdog();
      if (current >= SOURCES.length - 1) {
        succeed();
        return;
      }
      current++;
      stopWatchdog();
      watchdog = setTimeout(fail, 8000);
      frame.src = SOURCES[current].url;
    }

    frame.addEventListener('load', function () {
      // Первый источник проставлен прямо в разметке, чтобы сайт
      // открывался и без JavaScript. Здесь фиксируем успех.
      succeed();
    });

    // Быстрая проверка доступности основного сервера. Ответ непрозрачный
    // (mode: no-cors), поэтому она ловит обрыв связи и таймаут, но не
    // отличает 502 от 200 — на этот случай работает watchdog ниже.
    if (window.fetch && window.AbortController) {
      var ac = new AbortController();
      var probeTimer = setTimeout(function () { ac.abort(); }, 4000);

      fetch(SOURCES[0].url, { mode: 'no-cors', cache: 'no-store', signal: ac.signal })
        .then(function () { clearTimeout(probeTimer); })
        .catch(function () {
          clearTimeout(probeTimer);
          if (!settled && current === 0) fail();
        });
    }

    watchdog = setTimeout(fail, 8000);
  })();
</script>
