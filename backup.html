            background: radial-gradient(circle at 50% 50%, transparent 0%, #050010 90%);

            pointer-events: none;

            content: '';

            transform: perspective(500px) rotateX(60deg);
            animation: grid-move 5s linear infinite;
            z-index: -1;
            opacity: 0.6;
            mask-image: radial-gradient(circle at center, black 0%, transparent 70%);
            -webkit-mask-image: radial-gradient(circle at center, black 0%, transparent 70%);

        @keyframes grid-move {

        // --- Rich Text Renderer Component (REMASTERED) ---
        const RichText = ({ text, accentColor }) => {
            let borderColorClass = "border-white";
            let textColorClass = "text-white";
            let bgColorClass = "bg-white";

            if (accentColor.includes("ff0099")) { borderColorClass = "border-[#ff0099]"; textColorClass = "text-[#ff0099]"; bgColorClass = "bg-[#ff0099]"; }
            else if (accentColor.includes("00f3ff")) { borderColorClass = "border-[#00f3ff]"; textColorClass = "text-[#00f3ff]"; bgColorClass = "bg-[#00f3ff]"; }
            else if (accentColor.includes("bd00ff")) { borderColorClass = "border-[#bd00ff]"; textColorClass = "text-[#bd00ff]"; bgColorClass = "bg-[#bd00ff]"; }
            else if (accentColor.includes("ffea00")) { borderColorClass = "border-[#ffea00]"; textColorClass = "text-[#ffea00]"; bgColorClass = "bg-[#ffea00]"; }

            return (
                <div className="space-y-6">
                    {text.split('\n').map((line, idx) => {
                        const trimmed = line.trim();
                        if (!trimmed) return <div key={idx} className="h-2"></div>;

                        // 1. ЗАГОЛОВКИ (Бывшие 🔷) - NEW CYBER STYLE
                        if (trimmed.includes('🔷')) {
                            const content = trimmed.replace(/🔷/g, '').trim();
                            return (
                                <div key={idx} className="relative mt-10 mb-6 group">
                                    <h3 className={`text-2xl font-black text-white uppercase tracking-wider relative z-10 pl-6 border-l-4 ${borderColorClass}`}>
                                        {content}
                                    </h3>
                                    {/* Декоративная фоновая полоска */}
                                    <div className={`absolute top-0 bottom-0 left-0 w-full opacity-5 bg-gradient-to-r from-[${textColorClass}] to-transparent pointer-events-none`}></div>
                                </div>
                            );
                        }

                        // 2. ВОПРОСЫ (Бывшие ❔) - NEW CLEAN STYLE
                        if (trimmed.includes('❔')) {
                            const content = trimmed.replace(/❔/g, '').trim();
                            return (
                                <div key={idx} className="flex items-start gap-4 mt-8 mb-4">
                                    <div className={`shrink-0 p-1 rounded-full border ${borderColorClass} ${textColorClass} bg-white/5`}>
                                        <HelpCircle size={16} />
                                    </div>
                                    <h4 className={`text-lg font-bold text-white tracking-wide pt-0.5`}>
                                        {content}
                                    </h4>
                                </div>
                            );
                        }

                        // 3. ALERT / IMPORTANT (Бывшие ❕) - MINIMAL STYLE
                        if (trimmed.includes('❕') || trimmed.includes('Важный момент:')) {
                            const content = trimmed.replace(/❕/, '').trim();
                            const displayContent = content.replace('Важный момент:', '').trim();
                            return (
                                <div key={idx} className="my-5">
                                    <p className="text-sm md:text-base text-indigo-100/90 leading-relaxed font-normal">
                                        <span className={`inline-block font-mono text-xs font-black uppercase tracking-widest mr-2 ${textColorClass} border-b border-dashed ${borderColorClass.replace('border-', 'border-opacity-30 border-')} pb-px`}>
                                            Важный момент
                                        </span>
                                        {displayContent}
                                    </p>
                                </div>
                            );
                        }

                        // 4. Главы
                        if (/^Глава \d+:/.test(trimmed)) {
                            return (
                                <h4 key={idx} className={`text-lg font-bold text-white mt-8 mb-3 inline-block border-b-2 ${borderColorClass} pb-1`}>
                                    {trimmed}
                                </h4>
                            );
                        }

                        // 5. Списки - DIGITAL BULLETS
                        if (trimmed.startsWith('•') || trimmed.startsWith('⠀•') || trimmed.startsWith('-')) {
                            const content = trimmed.replace(/^[•⠀\s-]+/, '').trim();
                            return (
                                <div key={idx} className="flex items-start gap-4 ml-2 mb-3 group hover:translate-x-1 transition-transform duration-300">
                                    <div className={`w-1.5 h-1.5 mt-2.5 shrink-0 rotate-45 ${bgColorClass}`}></div>
                                    <span className="text-indigo-100/80 leading-relaxed text-sm md:text-base font-light">{content}</span>
                                </div>
                            );
                        }

                        // 6. Нумерованные списки
                        if (/^\d+\)/.test(trimmed)) {
                             const content = trimmed.replace(/^\d+\)\s*/, '').trim();
                             const number = trimmed.match(/^\d+/)[0];
                             return (
                                <div key={idx} className="flex items-start gap-4 ml-1 mb-4">
                                    <span className={`font-mono text-sm font-bold shrink-0 pt-1 opacity-50 ${textColorClass}`}>0{number}</span>
                                    <span className="text-indigo-100/80 leading-relaxed text-sm md:text-base font-light">{content}</span>
                                </div>
                             );
                        }

                        // Interactive Tooltips
                        if (trimmed.includes('В Токио на каждом углу есть комбини')) {
                             const parts = trimmed.split('комбини');
                             return (
                                <p key={idx} className="text-indigo-100/80 leading-8 font-light text-sm md:text-base">
                                    {parts[0]}
                                    <span className="group relative inline-block cursor-help border-b border-dashed border-white/40 hover:border-white transition-colors mx-1">
                                        <span className={`${textColorClass} font-medium`}>комбини</span>
                                        <span className="absolute bottom-full left-1/2 -translate-x-1/2 mb-2 hidden group-hover:block px-3 py-1.5 bg-[#1a0b33] border border-white/20 text-white text-xs rounded shadow-xl whitespace-nowrap z-50 backdrop-blur-md animate-fade-in">

                                </p>

                        if (trimmed.includes('эпохи Сёва')) {

                                    <span className="group relative inline-block cursor-help border-b border-dashed border-white/40 hover:border-white transition-colors mx-1">

                                            25 дек. 1926 г. – 7 янв. 1989 г.
                                        </span>
                                    </span>
                                    {parts[1]}
                                </p>
                            );
                        }

                        // Quote Block
                        if (trimmed.startsWith('Это не гастро-тур')) {
                            return (
                                <div key={idx} className="my-8 relative">
                                    <div className={`absolute left-0 top-0 bottom-0 w-1 ${bgColorClass} opacity-50`}></div>

                                        "{trimmed}"
                                    </p>
                                </div>
                            );
                        }

                        // Standard Paragraph
                        return (
                            <p key={idx} className="text-indigo-100/80 leading-8 font-light text-sm md:text-base">
                                {trimmed}
                            </p>
                        );
                    })}
                </div>

        };

        // --- ImageSlider component ---
        const ImageSlider = ({ images, title, accentColor }) => {
            const [currentIndex, setCurrentIndex] = useState(0);
            const [isHovered, setIsHovered] = useState(false);

            useEffect(() => {
                if (images.length <= 1 || isHovered) return;
                const interval = setInterval(() => {
                setCurrentIndex((prev) => (prev + 1) % images.length);
                }, 4000);
                return () => clearInterval(interval);
            }, [images, isHovered]);

            const nextSlide = (e) => {
                e.stopPropagation();
                setCurrentIndex((prev) => (prev + 1) % images.length);
            };

            const prevSlide = (e) => {
                e.stopPropagation();
                setCurrentIndex((prev) => (prev - 1 + images.length) % images.length);
            };

            return (
                <div
                className="relative h-64 md:h-full w-full overflow-hidden md:rounded-t-3xl shrink-0 group select-none bg-[#0a0118]"
                onMouseEnter={() => setIsHovered(true)}
                onMouseLeave={() => setIsHovered(false)}
                >
                {images.map((img, index) => (
                    <div
                    key={index}
                    className={`absolute inset-0 transition-opacity duration-1000 ease-in-out flex items-center justify-center ${index === currentIndex ? 'opacity-100' : 'opacity-0'}`}
                    >
                        <div
                            className="absolute inset-0 bg-cover bg-center opacity-50 blur-xl scale-110"
                            style={{ backgroundImage: `url(${img})` }}
                        ></div>

                        <img
                            src={img}
                            className="relative z-10 w-full h-full object-contain"
                            alt={`${title} ${index + 1}`}
                        />

                        <div className="absolute inset-0 bg-gradient-to-t from-[#0a0118] via-transparent to-transparent opacity-40 z-20"></div>
                    </div>
                ))}

                {images.length > 1 && (
                    <>
                    <button onClick={prevSlide} className={`absolute left-4 top-1/2 -translate-y-1/2 z-30 p-2 rounded-full bg-black/40 backdrop-blur-sm border border-white/10 text-white transition-all duration-300 hover:bg-white hover:text-black ${isHovered ? 'opacity-100 translate-x-0' : 'opacity-0 -translate-x-4'}`}>
                        <ChevronLeft size={24} />
                    </button>
                    <button onClick={nextSlide} className={`absolute right-4 top-1/2 -translate-y-1/2 z-30 p-2 rounded-full bg-black/40 backdrop-blur-sm border border-white/10 text-white transition-all duration-300 hover:bg-white hover:text-black ${isHovered ? 'opacity-100 translate-x-0' : 'opacity-0 translate-x-4'}`}>
                        <ChevronRight size={24} />
                    </button>
                    </>
                )}

                {images.length > 1 && (
                    <div className="absolute bottom-4 right-4 flex gap-1.5 z-30">
                    {images.map((_, idx) => (
                        <div
                        key={idx}
                        className={`h-1.5 rounded-full transition-all duration-300 cursor-pointer shadow-sm ${idx === currentIndex ? `w-8 bg-white` : `w-2 bg-white/30 hover:bg-white/60`}`}
                        onClick={(e) => {
                            e.stopPropagation();
                            setCurrentIndex(idx);

                    ))}
                    </div>
                )}

            );

        // --- FAQ COMPONENT ---
        const FAQItem = ({ question, answer, isOpen, onClick, index }) => {
            // Форматирование текста: выделяем ключевые фразы
            const formatAnswer = (text) => {
                const keywords = ["Это авторские прогулки", "фиксированная стоимость", "дополнительные расходы", "взрослую аудиторию", "заканчивается не в центре", "не дегустация", "современным искусством"];

                let formatted = text;
                keywords.forEach(key => {
                    formatted = formatted.replace(key, `**${key}**`);
                });

                return formatted.split(/(\*\*.*?\*\*)/).map((part, i) => {
                    if (part.startsWith('**') && part.endsWith('**')) {

        const FAQSection = () => {
            const [openIndex, setOpenIndex] = useState(null);

                    q: "Это классическая экскурсия с гидом?",
                    a: "Не совсем. Я не провожу лекции в стиле «посмотрите налево, это здание построено в 19 веке». Это авторские прогулки. Мы гуляем, я показываю изнанку города, объясняю, как устроено японское общество, как работает логистика мегаполиса и почему здесь всё так, как есть. Это живой диалог и погружение в атмосферу, а не пересказ Википедии."
                },
                {
                    q: "Цена указана за человека?",

                },
                {
                    q: "Можно ли с детьми?",

                },
                {

                },
                {
                    q: "Прогулка по Комбини — это гастро-тур?",
                    a: "Нет. Мы можем что-то купить по ходу дела, но цель прогулки — не дегустация. Мы разбираем, как устроена логистика, почему товары лежат именно так, как работают IT-системы магазинов и как этот бизнес выглядит изнутри."
                },
                {
                    q: "Я хочу посмотреть классическое искусство.",
                    a: "В рамках услуги «Арт-консьерж» я работаю только с современным искусством, дизайном, фото и иллюстрацией. Я не являюсь экспертом в классике (гравюры, буддийские статуи) и не смогу дать вам качественный контекст по этой теме."
                }

            return (
                <section className="relative z-20 mt-32 mb-20">
                     {/* Decorative Background Blur */}

                    <div className="flex flex-col items-center mb-16 text-center relative">

                            {/* 1. The "Vibe" Layer (English) - Huge & Graphical */}
                            <h2 className="text-[8rem] md:text-[12rem] font-black text-[#2a1b3d] select-none absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-0 leading-none opacity-50 italic tracking-tighter font-mono">
                                FAQ

                    <div className="max-w-3xl mx-auto">
                        {faqData.map((item, index) => (
                            <FAQItem

                                question={item.q}
                                answer={item.a}
                                index={index}
                                isOpen={openIndex === index}
                                onClick={() => setOpenIndex(openIndex === index ? null : index)}

                    {/* Декоративный элемент внизу списка */}

                        <div className="w-16 h-1 bg-white/20"></div>
                        <div className="w-4 h-1 bg-[#ff0099]"></div>
                         <div className="w-16 h-1 bg-white/20"></div>
                    </div>
                </section>
            );
        };

        function App() {
            const [selectedTour, setSelectedTour] = useState(null);
            const [isClosing, setIsClosing] = useState(false);
            const timerRef = useRef(null); // Store the timer ID
            // --- LOADER LOGIC ---
            useEffect(() => {
                // Сообщаем обёртке на tokyo-inside.art, что страница отрисована
                // и её экран загрузки можно убирать.
                const notifyParent = () => {
                    if (window.self === window.top) return;
                    try {
                        window.parent.postMessage({ type: 'tokyo-inside-ready' }, '*');
                    } catch (e) { /* обёртка на другом домене — не критично */ }
                };

                // Сигнал уходит сразу: ждать, пока догорит свой экран, незачем.
                // Экраны в обёртке и здесь визуально идентичны, поэтому неважно,
                // какой из них виден в момент перехода — важно лишь, что контент
                // под ними готов. Раньше сигнал шёл через два таймера, и это
                // добавляло ровно секунду ожидания на пустом месте.
                notifyParent();

                const loader = document.getElementById('loader');
                if (loader) {
                    setTimeout(() => {
                        loader.style.opacity = '0';
                        setTimeout(() => {
                            loader.style.display = 'none';
                        }, 500);
                    }, 500); // Small delay to ensure smooth transition
                }
            }, []);


            // Обработка кнопки "Назад" и прокрутки страницы
            useLayoutEffect(() => {
                // Helper to handle padding
                const scrollbarWidth = window.innerWidth - document.documentElement.clientWidth;
                const nav = document.querySelector('nav'); // Находим навигацию

                if (selectedTour) {
                    // 1. Блокируем скролл
                    document.body.style.paddingRight = `${scrollbarWidth}px`;
                    document.body.style.overflow = 'hidden';
                    // Фикс для фиксированной шапки (чтобы не дергалась)
                    if (nav) nav.style.paddingRight = `${scrollbarWidth}px`;

                    window.history.pushState({ modalOpen: true }, '');
                } else {
                    // 2. Возвращаем как было (только когда модалка полностью исчезла)
                    document.body.style.paddingRight = '0px';
                    document.body.style.overflow = 'unset';
                    // Сброс для шапки
                    if (nav) nav.style.paddingRight = '0px';
                }

                // Обработчик события popstate (нажатие "Назад")
                const handlePopState = () => {
                    if (selectedTour) {
                        handleCloseModal();
                    }
                };

                window.addEventListener('popstate', handlePopState);

                return () => {
                    window.removeEventListener('popstate', handlePopState);
                };
            }, [selectedTour]);

            const handleCloseModal = () => {
                setIsClosing(true);
                timerRef.current = setTimeout(() => {
                    setSelectedTour(null);
                    setIsClosing(false);
                    timerRef.current = null;
                }, 500); // Длительность анимации закрытия (0.5s)
            };

            const onTourSelect = (tour) => {
                // If we are in the middle of closing, cancel it immediately
                if (timerRef.current) {
                    clearTimeout(timerRef.current);
                    timerRef.current = null;
                }
                setIsClosing(false); // Reset closing state
                setSelectedTour(tour); // Open new tour
            };

            return (
                <div className="min-h-screen bg-[#050010] text-indigo-100 font-sans selection:bg-[#bd00ff] selection:text-white overflow-x-hidden">

                        <div className="relative">
                        <Moon size={20} className="text-[#ffea00] fill-[#ffea00]" />
                        <div className="absolute inset-0 bg-[#ffea00] blur-md opacity-40"></div>
                        </div>
                        <span className="font-black text-xl tracking-tighter text-white italic">
                        REAL<span className="text-[#bd00ff]">TOKYO</span>
                        </span>
                    </div>
                    {/* Updated Link to Individual Request */}
                    <a
                        href={`https://t.me/${TG_BOT_NAME}?start=Individual`}
                        target="_blank"
                        className="flex items-center gap-2 px-4 py-1.5 rounded-full bg-white/5 border border-white/10 text-xs font-bold text-white uppercase tracking-wider hover:bg-white/10 hover:border-[#00f3ff]/50 transition-all"

                    <div className="absolute bottom-10 right-10 w-32 h-32 border-4 border-[#00f3ff] opacity-20 -rotate-6 rounded-full hidden md:block"></div>

                    <div className="inline-flex items-center gap-2 px-3 py-1 rounded border border-[#bd00ff]/30 bg-[#bd00ff]/10 text-[#bd00ff] text-[10px] font-bold uppercase tracking-[0.2em] mb-6">
                    <Sparkles size={12} /> Authentic Experience
                    </div>

                    <div className="flex flex-col items-center mb-6">

                            INSIDER
                        </h1>

                            <div className="h-px w-8 md:w-16 bg-[#00f3ff]/50"></div>
                            <span className="text-white/60 font-mono text-xs md:text-sm tracking-widest">
                                東京インサイダー
                            </span>
                            <div className="h-px w-8 md:w-16 bg-[#ff0099]/50"></div>
                        </div>
                    </div>

                    <p className="text-base md:text-lg text-indigo-200/80 max-w-xl mx-auto leading-relaxed mb-10 font-light">
                    Изнанка города для тех, кто ненавидит «туристические» места. <br/>
                    Киберпанк, арт, урбанистика и правда о Японии.

                    <div className="flex flex-wrap justify-center gap-4">
                    {['Cyberpunk', 'Underground', 'Art', 'NO FILTERS'].map((tag, i) => (

                        <div className="skew-x-12">{tag}</div>

                        <TourCard key={tour.id} tour={tour} onClick={() => onTourSelect({ ...tour, index })} />

                    <div className="relative z-10 flex flex-col md:flex-row items-center justify-between gap-8 text-center md:text-left">
                        <div>
                        <h3 className="text-2xl md:text-4xl font-black text-white mb-4 uppercase italic">Индивидуальный запрос?</h3>
                        <p className="text-indigo-200/80 max-w-md text-sm leading-relaxed">
                            Я не вожу людей по барам и в толпы туристов. Но если вы ищете уникальный маршрут под ваши интересы (аниме-локации, скрытая архитектура) — пишите.
                        </p>
                        </div>
                        {/* Updated Link to Individual Request */}
                        <a
                        href={`https://t.me/${TG_BOT_NAME}?start=Individual`}
                        target="_blank"
                        rel="noreferrer"
                        className="shrink-0 bg-white text-black px-8 py-4 rounded-xl font-black uppercase tracking-widest text-sm hover:bg-[#00f3ff] transition-colors shadow-[0_0_30px_rgba(255,255,255,0.2)]"
                        >
                        Написать в Telegram
                        </a>
                    </div>
                    </div>

                    {/* FAQ SECTION INSERTED HERE */}
                    <FAQSection />

                </main>

                <footer className="border-t border-white/5 py-12 bg-[#020005] text-center relative z-10">
                    <div className="flex justify-center gap-6 mb-8 opacity-50">
                    <Palette size={20} />
                    <Train size={20} />
                    <Camera size={20} />
                    </div>
                    <div className="text-white/30 text-xs font-mono uppercase tracking-widest">
                    © {new Date().getFullYear()} Unofficial Tokyo Guide
                    </div>
                </footer>

                {selectedTour && (
                    <Modal tour={selectedTour} index={selectedTour.index} onClose={handleCloseModal} isClosing={isClosing} />
                )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
